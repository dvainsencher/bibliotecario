name: Teste

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  teste:
    name: ${{ matrix.nome }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: Mac Apple Silicon
            os: macos-latest
          - nome: Mac Intel
            os: macos-15-intel
          - nome: Linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar poppler (Mac)
        if: runner.os == 'macOS'
        run: brew install poppler

      - name: Instalar poppler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Versões
        run: |
          python3 --version
          pdftotext -v
          python3 -c "import sqlite3; c = sqlite3.connect(':memory:'); c.execute('create virtual table t using fts5(x)'); print('FTS5 ok, SQLite', sqlite3.sqlite_version)"

      - name: Rodar o teste
        run: python3 testes/rodar_teste.py
